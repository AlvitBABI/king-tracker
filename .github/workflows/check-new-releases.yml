name: Check for new Stephen King releases

on:
  schedule:
    - cron: '0 8 1 * *' # 08:00 UTC on the 1st of every month
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-new-releases.mjs --issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
      # GitHub disables scheduled workflows after 60 days without repo activity.
      # Re-enabling on every run keeps the monthly check alive.
      - name: Keep this scheduled workflow enabled
        if: always()
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/check-new-releases.yml/enable"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
